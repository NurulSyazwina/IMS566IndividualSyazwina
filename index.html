<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <!-- Bootsrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootsrap Icon -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     <!-- font google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sekuya&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="style.css">
</head>
  <body id="bg-vanta">
   <div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <!-- error message container -->
    <div class="alert alert-danger d-none mb-3 text-center" id="errorMessage" style="width:300px;">
        Invalid email or password </div>
    <!-- login card -->
    <div class="card login-card">  
        <div class="card-body">
                <h3 class="text-center mb-2">Login</h3>
                    <label for="Email">Email</label>
                        <div class="input-group mb-3">
                        <span class="input-group-text left-icon"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email">
                        </div>
                    <label for="Password">Password</label>
                        <div class="input-group mb-3">
                        <span class="input-group-text left-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password">
                        <span class="input-group-text" onclick="togglePassword()" style="cursor: pointer;"><i class="bi bi-eye" id="toggleIcon"></i></span>
                    </div>
                <button class="btn btn-primary w-100 mb-3" onclick="loginUser()">Login</button>
            <div class="text-center"><p class="small text-muted mb-0"> Don't have an account?<a href="register.html" class="text-decoration-none fw-bold"> Register</a></p></div>
            </div>
        </div>
    </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<script>
VANTA.FOG({
  el: "#bg-vanta",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  highlightColor: 0x0,
  midtoneColor: 0xf42515
})
</script>

<script>

    // function for show and hide password
    function togglePassword() {
        const password = document.getElementById("password");
        const icon = document.getElementById("toggleIcon");
            if (password.type === "password") {
            password.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
            } 

            else {
            password.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
            }
    }
    // function for login user
    function loginUser(){
        const validEmail = "nurulsyazwina@gmail.com";
        const validPassword = "wina123";
        const email = document.getElementById("email") .value.trim();
        const password =document.getElementById("password") .value;
        const errorBox = document.getElementById("errorMessage");
            if(email === validEmail && password === validPassword){
                errorBox.classList.add("d-none");
                window.location.href = "dashboard.html";
            }
            else{
                errorBox.classList.remove("d-none");
            }
    }
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
