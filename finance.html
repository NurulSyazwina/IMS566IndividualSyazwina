<div class="container mt-4">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow border-0 p-4 h-100">
                <!-- To add expenses -->
                <h4 class="mb-4"><i class="bi bi-wallet2"></i> Add Expense</h4>
                <label>Expense Item</label>
                <input type="text" class="form-control mb-3" id="itemInput">
                <label>Amount (RM)</label>
                <input type="number" class="form-control mb-3" id="amountInput">
                <button class="btn btn-primary w-100" onclick="addExpense()">Add Expense</button>
            </div>
        </div>

    <div class="col-lg-6">
        <div class="card shadow border-0 p-4 h-100">
            <!-- For saving goals-->
            <h4 class="mb-4"><i class="bi bi-cash-coin"></i> Savings Goal</h4>
            <label>Saving Goal Name</label>
            <input type="text" class="form-control mb-3" id="goalNameInput">
            <label>Target Savings (RM)</label>
            <input type="number" class="form-control mb-3" id="goalInput">
            <button class="btn btn-primary w-100 mb-4" onclick="saveMoney()">Save Goal</button>
            <div class="mb-2 d-flex justify-content-between">
            <span id="goalNameText">No Goal Yet</span>
            <span id="progressText">0%</span>
        </div>

        <div class="progress" style="height:25px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated" id="savingBar" style="width:0%"></div>
        </div>

        <div class="mt-3 text-center">
            <h5>RM <span id="currentSaving">0</span> / RM <span id="goalSaving">0</span></h5>
        </div>
    </div>
</div>
    <!-- Expense History data -->
    <div class="card shadow border-0 mt-4">
        <div class="card-body">
            <h4 class="mb-3"><i class="bi bi-clock-history"></i> Expense History</h4>
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script>
        // function to retrieve data from session storage 
        let expenses = JSON.parse(sessionStorage.getItem("expenses")) || [];
        let savings = JSON.parse(sessionStorage.getItem("savings")) || {
            name: "No Goal Yet",
            goal: 0,
            current: 0
        };
        let goal = parseFloat(document.getElementById("goalInput").value);

    // Add item expenses
    function addExpense() {
        let item = document.getElementById("itemInput").value.trim();
        let amount = parseFloat(document.getElementById("amountInput").value);
            if(item === "" || isNaN(amount) || amount <= 0) {
            alert("Please enter valid expense details");
            return;
        }
        let expense = {
        item: item,
        amount: amount,
        date: new Date().toISOString()
        };

        expenses.push(expense);

        sessionStorage.setItem(
            "expenses",
            JSON.stringify(expenses)
        );

        loadExpenses();
        document.getElementById("itemInput").value = "";
        document.getElementById("amountInput").value = "";
        alert("Expense Added!");
    }
    // function to load expenses data into table 
    function loadExpenses() {
        let table = document.getElementById("expenseTableBody");
        table.innerHTML = "";
        if(expenses.length === 0) {
        table.innerHTML = 
        `<tr>
            <td colspan="3" class="text-center text-muted py-4">No expenses added yet</td>
        </tr>`;
        return;
        }

        expenses.forEach((expense) => {
        table.innerHTML += 
        `<tr>
            <td>${expense.item}</td>
            <td>RM ${expense.amount.toFixed(2)}</td>
            <td>
                ${new Date(expense.date)
                .toLocaleDateString()}
            </td>
        </tr>`;
        });
    }

    // function to save money for saving goal
    function saveMoney() {
        let goalName = document.getElementById("goalNameInput") .value.trim();
        let goal =parseFloat(document.getElementById("goalInput").value);

            if(goalName === "" || isNaN(goal) || goal <= 0) {
            alert("Please enter valid saving goal");
            return;
        }
            savings.name = goalName;
            savings.goal = goal;
            sessionStorage.setItem("savings", JSON.stringify(savings));
        updateSavingsUI();
        alert("Saving Goal Created!");
    }
    // function to update saving goal 
    function updateSavingsUI() {
        let percentage = 0;
        if(savings.goal > 0) {
        percentage = (savings.current / savings.goal) * 100;
        }

        percentage = Math.min(percentage, 100);

        document.getElementById("savingBar").style.width = percentage + "%";
        document.getElementById("progressText").innerText = percentage.toFixed(0) + "%";
        document.getElementById("currentSaving").innerText = savings.current.toFixed(2);
        document.getElementById("goalSaving").innerText = savings.goal.toFixed(2);
        document.getElementById("goalNameText").innerText = savings.name;
    }
        // function dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        const htmlElement = document.documentElement;

        //check current theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        //toggle
        darkModeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        //change icon
        function updateIcon(theme) {
            if (theme === 'dark'){
                darkModeIcon.className = 'bi bi-sun-fill';
            } else {
                darkModeIcon.className = 'bi bi-moon-stars-fill';
            }
        }

    loadExpenses();
    updateSavingsUI();

</script>
