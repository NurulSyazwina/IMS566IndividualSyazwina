<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container-fluid">
    <a class="navbar-brand" href="dashboard.html"><b>PocketFlow</b></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">Home</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="finance.html">FinanceHub</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="study.html">StudyHub</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html">Logout</a>
        </li>
      </ul>
       <div class="d-flex ms-3">
        <button class="dark-mode-toggle" id="darkModeToggle" title="Dark Mode Toggle">
            <i class="bi bi-moon-stars-fill" id="darkModeIcon"></i>
        </button>

<div class="container mt-4">
<div class="row g-4">
    <!-- Expense Categories pie chart -->
    <div class="col-lg-7">
        <div class="card p-4 shadow border-0 h-100">
            <h4 class="mb-3"><i class="bi bi-pie-chart-fill"></i> Expense Categories</h4>
            <canvas id="pieChart" style="max-height:500px;"></canvas>
        </div>
    </div>
    <!-- Monthly Spending Line Chart -->
    <div class="col-lg-5">
        <div class="card p-4 shadow border-0 mb-4">
            <h4 class="mb-3"><i class="bi bi-bar-chart-fill"></i> Monthly Spending</h4>
            <canvas id="lineChart"></canvas>
        </div>
        <!-- Savings Goal -->
    <div class="card p-4 shadow border-0">
        <h5 class="text-muted mb-3" id="savingGoalName"></h5>

    <div class="progress" style="height:25px;"> 
        <div class="progress-bar bg-success" id="dashboardSavingBar"></div>
    </div>

    <div class="mt-3 text-center">
        <h5>RM <span id="dashboardCurrent"></span> / RM <span id="dashboardGoal"></span></h5>
    </div>

    <div class="mt-4">
        <label>Add Savings Money (RM)</label>
        <div class="input-group mt-2">
            <input type="number"
            class="form-control"
            id="dashboardSavingInput"
            placeholder="Enter amount">
            <button class="btn btn-primary" onclick="addDashboardSaving()">Add</button></div>
        </div>
    </div>
</div> 

<!-- Your To-Do List  -->
<div class="row mt-4 g-4">
    <div class="col-lg-8">
        <div class="card shadow-lg border-0 h-100">
            <div class="card-body">
                <h4 class="mb-4"><i class="bi bi-check2-circle"></i>Your To-Do List</h4>
                <div id="assignmentList"></div>
            </div>
        </div>
    </div>
<!-- Current Class Reminder -->
    <div class="col-lg-4">
        <div class="card shadow-lg border-0 h-100 reminder-card">
            <div class="card-body">
                <h4 class="mb-4"><i class="bi bi-alarm-fill"></i> Current Class</h4>
                <div id="currentClassBox">
                    <div class="text-muted"> No class right now</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // to retrieved data from session storage and display in dashboard
    let expenses = JSON.parse(sessionStorage.getItem("expenses")) || [];
    let savings = JSON.parse(sessionStorage.getItem("savings")) || {
        name: "No Goal Yet",
        goal: 0,
        current: 0
    };

    let expenseLabels = [];
    let expenseAmounts = [];
    let expenseColors = [];

    // function to generate colors for pie chart
    function generateColor() {
        const colors = [
            "rgb(255, 99, 132)","rgb(54, 162, 235)","rgb(255, 206, 86)",
            "rgb(75, 192, 192)","rgb(153, 102, 255)","rgb(255, 159, 64)",
            "rgb(141, 209, 126)", "rgb(108, 92, 231)", "rgb(0, 206, 201)",
        ];
            return colors[
             Math.floor(Math.random() * colors.length)
            ];
    }
        // create pie chart 
        const pieCtx = document.getElementById('pieChart');
        const pieChart = new Chart(pieCtx, {
            type: 'pie', data: {
                labels: [], datasets: [{
                data: [], backgroundColor: [],
                borderWidth: 2
        }]
    },

            options: {
                responsive: true,
                    plugins: {
                    legend: {
                    position: 'bottom'
                }
            }
        }
    });

        // function line chart
        let monthlyData = {
            Jan: 0, Feb: 0, Mar: 0, Apr: 0, May: 0, Jun: 0,
            Jul: 0, Aug: 0, Sep: 0, Oct: 0, Nov: 0,Dec: 0
        };

        const lineCtx = document.getElementById('lineChart');
        const lineChart = new Chart(lineCtx, {
        type: 'bar', data: {
        labels: Object.keys(monthlyData),
        datasets: [{
            label: 'Monthly Expenses',
            data: Object.values(monthlyData),
            borderWidth: 2,
            borderRadius: 10
        }]
    },

        options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
    // function to load data into dashboard
    function loadDashboardData() {
            expenseLabels = [];
            expenseAmounts = [];
            expenseColors = [];

        for(let month in monthlyData) {
            monthlyData[month] = 0;
        }

        expenses.forEach((expense) => {
        expenseLabels.push(expense.item);
        expenseAmounts.push(expense.amount);
        expenseColors.push(generateColor());

        let month = new Date(expense.date)
        .toLocaleString('default', {
            month: 'short'
        });

        if(monthlyData[month] !== undefined) {
            monthlyData[month] += expense.amount;
        }
    });

        pieChart.data.labels = expenseLabels;
        pieChart.data.datasets[0].data = expenseAmounts;
        pieChart.data.datasets[0].backgroundColor = expenseColors;

    pieChart.update();
        lineChart.data.datasets[0].data = Object.values(monthlyData);

    lineChart.update();
        document.getElementById("savingGoalName").innerText = savings.name;
        
        // to calculate percentage for savings goal progress
        let percentage = 0;
            if(savings.goal > 0) {
            percentage = (savings.current / savings.goal) * 100;
        }

        percentage = Math.min(percentage, 100);

        document.getElementById(
            "dashboardSavingBar"
            ).style.width = percentage + "%";

        document.getElementById(
            "dashboardSavingBar"
            ).innerText = percentage.toFixed(0) + "%";

        document.getElementById(
            "dashboardCurrent"
            ).innerText = savings.current.toFixed(2);

        document.getElementById(
            "dashboardGoal"
            ).innerText = savings.goal.toFixed(2);
    }
    // function to add savings money from dashboard
    function addDashboardSaving() {
        let amount = parseFloat(document.getElementById("dashboardSavingInput").value);
            if(isNaN(amount) || amount <= 0) {
                alert("Enter valid amount");
            return;}

            savings.current += amount;
            sessionStorage.setItem("savings", JSON.stringify(savings));

        loadDashboardData();
            document.getElementById("dashboardSavingInput").value = "";
                alert("Savings Added!");
    }
    // fuction to retrieved Your To-Do List data 
    function loadAssignments() {
        let container = document.getElementById("assignmentList");
        let assignments = JSON.parse(sessionStorage.getItem("assignments")) || [];

        if(assignments.length === 0) {
            container.innerHTML = `<div class="text-center text-muted py-4">No tasks yet. Add your assignments in StudyHub </div>`;
            return;}

        container.innerHTML = "";
        assignments.forEach((item, index) => {

        let completed = item.completed || false;
        container.innerHTML += 
        `<div class=" border rounded p-3 mb-3 d-flex justify-content-between align-items-center ${completed ? 'bg-success text-white' : ''}"><div>
                <h6 class="mb-1"> ${item.subject}</h6>
                    <p class="mb-1"> ${item.name}</p>
                        <small class=" ${completed ? 'text-light' : 'text-muted'}"> Due: ${item.date}</small>
            </div>
            <div><input type="checkbox" class="form-check-input fs-4" ${completed ? 'checked' : ''} onchange="toggleAssignment(${index})"></div>
        </div>`;
    });
}
    function toggleAssignment(index) {
        let assignments = JSON.parse(sessionStorage.getItem("assignments")) || [];
        assignments[index].completed = !assignments[index].completed;

        sessionStorage.setItem("assignments", JSON.stringify(assignments));
    loadAssignments();
    }
    // fumction to retrieved data of current class  
    function loadCurrentClass() {
        let classes = JSON.parse(sessionStorage.getItem("classes")) || [];
        let currentBox = document.getElementById("currentClassBox");
        let now = new Date();
        let currentDay = now.toLocaleDateString('en-US', { weekday:'long'});
        let currentHour = now.getHours();
        let currentMinute = now.getMinutes();
        let currentTime = currentHour * 60 + currentMinute;
        let currentClass = null;
        let nextClass = null;

    classes.forEach(item => {
        let startParts = item.start.split(":");
        let endParts = item.end.split(":");
        let startMinutes = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
        let endMinutes = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
        
        if(item.day === currentDay){
            if(
                currentTime >= startMinutes &&
                currentTime <= endMinutes
            ){
                currentClass = item;
            }

            if(
                startMinutes > currentTime &&
                nextClass === null
            ){

                nextClass = item;
            }
        }
    });

        if(currentClass){
        currentBox.innerHTML = 
        `<div class="current-class"
            style="background:${currentClass.color};">
            <p>NOW IN CLASS</p>
                <h2> ${currentClass.name}</h2>
            <div class="mt-3"> ${currentClass.start} - ${currentClass.end} </div>
        </div>

        ${
            nextClass ?
            `<div class="next-class">
                <small class="text-muted"> Next Class </small>
                <h6 class="mt-2 mb-1">${nextClass.name}</h6>
                <small> ${nextClass.start} - ${nextClass.end}</small>
            </div>` : ''
        }

        `; }
            else{
                currentBox.innerHTML = 
                `<div class="text-center py-5">
                    <i class="bi bi-cup-hot fs-1 text-muted"></i>
                        <h5 class="mt-3"> No class right now </h5>
            ${
                nextClass ?
                `<div class="next-class mt-4">
                    <small class="text-muted"> Next Class </small>
                    <h6 class="mt-2 mb-1"> ${nextClass.name}</h6>
                        <small>${nextClass.start} - ${nextClass.end} </small>
                </div>` : ''
            }
        </div>`;
    }
}
        // function dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        const htmlElement = document.documentElement;

        //check current theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        //toggle
        darkModeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        //change icon
        function updateIcon(theme) {
            if (theme === 'dark'){
                darkModeIcon.className = 'bi bi-sun-fill';
            } else {
                darkModeIcon.className = 'bi bi-moon-stars-fill';
            }
        }

        loadAssignments();
        loadDashboardData();
        loadCurrentClass();
</script>

<footer class="footer mt-5">
    <div class="container text-center"> © 2026 PocketFlow <br>
        <small>Manage your study life smarter <i class="bi bi-book"></i></small><br>
    </div>
</footer>

</body>
</html>
