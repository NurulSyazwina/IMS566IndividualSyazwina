<div class="container mt-4">
    <div class="row g-4">
        <!-- YourTo-Do List -->
        <div class="col-lg-4 col-md-12">
            <div class="custom-card h-100">
                <h4 class="section-title"><i class="bi bi-check2-square"></i> Your To-Do List</h4>
                <ul class="list-group mt-3 mb-3" id="assignmentList"></ul>
                <label>Category</label>
                <input type="text" id="subject" class="form-control mb-3">
                <label>Task Title</label>
                <input type="text" id="assignmentName" class="form-control mb-3">
                <label>Deadline</label>
                <input type="date" id="dueDate" class="form-control mb-3">
                <button class="btn btn-primary w-100" onclick="addAssignment()">Add Task</button>
             <hr>
    <!-- Pomodoro Timer -->
    <div class="pomodoro-card mt-4">
        <div class="pomodoro-header">
            <h5 class="section-title mb-0">Pomodoro <i class="bi bi-hourglass-split"></i></h5>
            <span class="mode-badge" id="modeBadge">Focus</span>
        </div>
        <p id="timerStatus" class="mt-2 text-center">Stay focused! <i class="bi bi-highlighter"></i></p>

    <div class="timer-circle">
        <div class="timer-display" id="timerDisplay"> 25:00</div>
    </div>

    <div class="d-flex gap-2">
        <button class="btn btn-success w-100" onclick="startTimer()"><i class="bi bi-play-fill"></i>Start</button>
        <button class="btn btn-warning w-100" onclick="pauseTimer()"><i class="bi bi-pause-fill"></i>Pause</button>
        <button class="btn btn-danger w-100" onclick="resetTimer()"><i class="bi bi-arrow-counterclockwise"></i>Reset</button>
    </div>
        <audio id="studyMusic" loop><source src="song/pomodoro-timer.mp3" type="audio/mp3"></audio>
        </div>
    </div>
</div>
    <!-- Weekly Timetable -->
    <div class="col-lg-8 col-md-12">
        <div class="custom-card h-100">
            <h4 class="section-title"><i class="bi bi-table"></i> Weekly Timetable</h4>
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <input type="text" id="className" class="form-control" placeholder="Subject Name">
                    </div>
                    <div class="col-md-2">
                        <select id="classDay" class="form-select">
                            <option>Monday</option>
                            <option>Tuesday</option>
                            <option>Wednesday</option>
                            <option>Thursday</option>
                            <option>Friday</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="time" id="startTime" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <input type="time" id="endTime" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="addClass()">Add Class</button>
                    </div>
                </div>
                <div id="timetableBody"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>

        let editIndex = null;
    // function of Your To-Do List
    function getAssignments() {
        return JSON.parse(sessionStorage.getItem("assignments")) || [];
    }

    function saveAssignments(data) {
        sessionStorage.setItem("assignments", JSON.stringify(data));
    }

    function addAssignment() {
    let subject = document.getElementById("subject").value;
    let name = document.getElementById("assignmentName").value;
    let date = document.getElementById("dueDate").value;
    let assignments = getAssignments();
        if(editIndex === null) {
            assignments.push({
                subject,
                name,
                date
            });
        } 
        else {
            assignments[editIndex].subject = subject;
            assignments[editIndex].name = name;
            assignments[editIndex].date = date;
            editIndex = null;
        }
        saveAssignments(assignments);
        clearForm();
        renderAssignments();
    }

    function clearForm() {
        document.getElementById("subject").value = "";
        document.getElementById("assignmentName").value = "";
        document.getElementById("dueDate").value = "";
    }

    function renderAssignments() {
        let list = document.getElementById("assignmentList");
        let assignments = getAssignments();
        list.innerHTML = "";
        assignments.forEach((item, index) => {
        let li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = 
            `<div>
                <b>${item.subject}</b><p class="mb-1">${item.name}</p>
                <small>Deadline: ${item.date}</small>
            </div>
            <div>
                <button class="btn btn-sm btn-warning me-2" onclick="editAssignment(${index})">
                    Edit
                </button>

                <button class="btn btn-sm btn-danger" onclick="deleteAssignment(${index})">
                    Delete
                </button>
            </div>`;
            list.appendChild(li);
        });
    }

    function editAssignment(index) {
        let assignments = getAssignments();
        let item = assignments[index];
        document.getElementById("subject").value = item.subject;
        document.getElementById("assignmentName").value = item.name;
        document.getElementById("dueDate").value = item.date;
        editIndex = index;
    }

    function deleteAssignment(index) {
        let assignments = getAssignments();
        assignments.splice(index, 1);
        saveAssignments(assignments);
        renderAssignments();
    }

    renderAssignments();

    // function to retrieve class data from session storage
    function getClasses(){
        return JSON.parse(
            sessionStorage.getItem("classes")
        ) || [];
    }

    function saveClasses(data) {
        sessionStorage.setItem(
            "classes",
            JSON.stringify(data)
        );
    }

    function randomColor() {
        const colors = [
        "rgb(255, 179, 193)", "rgb(160, 196, 255)", "rgb(189, 178, 255)", "rgb(202, 255, 191)",
        "rgb(255, 214, 165)", "rgb(155, 246, 255)", "rgb(255, 198, 255)","rgb(241, 192, 232)"
        ];
        return colors[
            Math.floor(Math.random() * colors.length)
        ];
    }

    function addClass() {
        let name = document.getElementById("className").value;
        let day = document.getElementById("classDay").value;
        let start = document.getElementById("startTime").value;
        let end = document.getElementById("endTime").value;
        if(name === "" || start === "" || end === "") {
            alert("Please fill all fields");
            return;
        }
        let classes = getClasses();
            classes.push({
            name,
            day,
            start,
            end,
            color: randomColor()
        });
        saveClasses(classes);
        renderTimetable();
    }

    function renderTimetable(){
        let timetable = document.getElementById("timetableBody");
        let classes = getClasses();
        const days = [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
        ];
        const colors = [
            "rgb(124, 58, 237)",
            "rgb(236, 72, 153)",
            "rgb(59, 130, 246)",
            "rgb(239, 68, 68)",
            "rgb(20, 184, 166)",
            "rgb(245, 158, 11)"
        ];
        let html = 
        `<div class="table-responsive">
            <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th style="width:120px;">Time</th>`;

        days.forEach(day=>{
        html += `<th>${day}</th>`;
        });
        html += `</tr></thead><tbody>`;

        let skipMap = {};
        for(let hour = 8; hour <= 17; hour++){
        html += `<tr>`;

        html += `<td class="fw-bold"
        style="height:55px;">
            ${hour}:00
        </td>`;
        days.forEach(day=>{
            let key = day + hour;
            if(skipMap[key]){
                return;
            }
            let found = null;
            classes.forEach((item,index)=>{
                let startHour = parseInt(item.start.split(":")[0]);
                let endHour = parseInt(item.end.split(":")[0]);
                if(
                    item.day === day &&
                    startHour === hour
                ){
                    found = {
                        ...item,
                        color:
                        colors[index % colors.length],
                        duration:
                        endHour - startHour
                    };
                    for(
                        let h = startHour + 1;
                        h < endHour;
                        h++
                    ){
                        skipMap[day + h] = true;
                    }
                }
                });

                if(found){
                html += `<td rowspan="${found.duration}">
                    <div class="subject-box" style="background:${found.color}; 
                        color:white;
                        border-radius:16px;
                        height:100%;
                        min-height:${found.duration * 55}px;
                        display:flex;
                        flex-direction:column;
                        justify-content:center;
                        align-items:center;
                        font-weight:bold;
                        padding:10px;">
                        <div style="font-size:20px;">
                            ${found.name}
                        </div>
                        <small> ${found.start} - ${found.end}</small>
                    </div>
                    </td>`;
                }
                else{
                    html += `<td></td>`;
                }
            });
            html += `</tr>`;
            }
            html += `</tbody></table></div>`; 
        timetable.innerHTML = html;
    }
    // function for pomodoro timer
        let timer;
        let focusTime = 25 * 60;
        let breakTime = 5 * 60;
        let timeLeft = focusTime;
        let isBreak = false;
        let isRunning = false;

        const timerDisplay = document.getElementById("timerDisplay");
        const timerStatus = document.getElementById("timerStatus");
        const modeBadge = document.getElementById("modeBadge");
        const studyMusic = document.getElementById("studyMusic");
        const alarmSound = document.getElementById("alarmSound");

    function updateTimerDisplay(){
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
            timerDisplay.innerHTML = `
                ${String(minutes).padStart(2,"0")}:
                ${String(seconds).padStart(2,"0")}`;
    }

    function startTimer(){
        if(isRunning) return;
        isRunning = true;
        studyMusic.play();
        timer = setInterval(()=>{
            timeLeft--;
            updateTimerDisplay();

        if(timeLeft <= 0){
            clearInterval(timer);
            isRunning = false;
            if(!isBreak){
                isBreak = true;
                modeBadge.innerText = "Break";
                timerStatus.innerText = 'Break time! <i class="bi bi-cup-hot"></i> Relax a bit';
                timeLeft = breakTime;
                setTimeout(()=> startTimer(), 2000);
            } else {
                isBreak = false;
                modeBadge.innerText = "Focus";
                timerStatus.innerText = 'Back to study! <i class="bi bi-highlighter"></i>';
                timeLeft = focusTime;
                setTimeout(()=> startTimer(), 2000);
            }
            updateTimerDisplay();
        }
    },1000);
}

    function pauseTimer(){
        clearInterval(timer);
        isRunning = false;
        studyMusic.pause();
    }

    function resetTimer(){
        clearInterval(timer);
        isRunning = false;
        studyMusic.pause();
        studyMusic.currentTime = 0;
        isBreak = false;
        timeLeft = focusTime;
        modeBadge.innerText ="Focus";
        timerStatus.innerHTML ='Stay focused! <i class="bi bi-highlighter"></i>';
        updateTimerDisplay();
    }

    updateTimerDisplay();
    updateTimerDisplay();
    renderTimetable();

        // function dark mode toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        const htmlElement = document.documentElement;

        //check current theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        //toggle
        darkModeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        //change icon
        function updateIcon(theme) {
            if (theme === 'dark'){
                darkModeIcon.className = 'bi bi-sun-fill';
            } else {
                darkModeIcon.className = 'bi bi-moon-stars-fill';
            }
        }
</script>
